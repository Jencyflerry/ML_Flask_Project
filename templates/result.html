<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Churn Prediction Result</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #333;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 40px auto;
        }

        .header {
            background: #1f4e78;
            color: white;
            padding: 30px;
            text-align: center;
            border-radius: 12px 12px 0 0;
        }

        .header h1 {
            margin: 0;
            font-size: 30px;
        }

        .header p {
            margin-top: 10px;
            font-size: 15px;
        }

        .result-container {
            background: white;
            padding: 35px;
            border-radius: 0 0 12px 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        /* Prediction */

        .prediction-box {
            text-align: center;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 30px;
            background: #f8fafc;
        }

        .prediction-box h2 {
            margin-top: 0;
            color: #1f4e78;
        }

        #predictionResult {
            font-size: 28px;
            font-weight: bold;
        }

        /* Probability Cards */

        .cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
        }

        .card h3 {
            margin-top: 0;
            font-size: 17px;
            color: #555;
        }

        .percentage {
            font-size: 32px;
            font-weight: bold;
        }

        /* Probability bars */

        .bar-container {
            width: 100%;
            height: 22px;
            background: #e5e7eb;
            border-radius: 20px;
            overflow: hidden;
            margin-top: 15px;
        }

        .bar {
            height: 100%;
            width: 0%;
            transition: width 1s ease;
        }

        #churnBar {
            background: #dc3545;
        }

        #stayBar {
            background: #28a745;
        }

        /* Risk */

        .risk-box {
            text-align: center;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 10px;
        }

        .risk-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        #riskLevel {
            font-size: 30px;
            font-weight: bold;
        }

        /* Recommendation */

        .recommendation {
            padding: 25px;
            background: #eef5fb;
            border-left: 5px solid #1f4e78;
            border-radius: 6px;
            margin-bottom: 30px;
        }

        .recommendation h3 {
            margin-top: 0;
            color: #1f4e78;
        }

        #recommendationText {
            font-size: 16px;
            line-height: 1.6;
        }

        /* Button */

        .button-container {
            text-align: center;
            margin-top: 25px;
        }

        button {
            background: #1f4e78;
            color: white;
            border: none;
            padding: 14px 35px;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #163a5c;
        }

        .error {
            text-align: center;
            padding: 30px;
            color: #b30000;
            background: #ffe6e6;
            border-radius: 8px;
        }

        /* Mobile */

        @media (max-width: 700px) {

            .cards {
                grid-template-columns: 1fr;
            }

            .container {
                width: 95%;
            }

            .header h1 {
                font-size: 24px;
            }

            #predictionResult {
                font-size: 22px;
            }

            #riskLevel {
                font-size: 24px;
            }
        }

    </style>

</head>


<body>

<div class="container">

    <!-- Header -->

    <div class="header">

        <h1>
            Telecom Customer Churn Prediction
        </h1>

        <p>
            Machine Learning Prediction Result
        </p>

    </div>


    <div class="result-container">

        <!-- Prediction -->

        <div class="prediction-box">

            <h2>
                Prediction
            </h2>

            <div id="predictionResult">
                Loading...
            </div>

        </div>


        <!-- Probability Cards -->

        <div class="cards">

            <!-- Churn -->

            <div class="card">

                <h3>
                    Churn Probability
                </h3>

                <div
                    class="percentage"
                    id="churnProbability">
                    0%
                </div>

                <div class="bar-container">

                    <div
                        class="bar"
                        id="churnBar">
                    </div>

                </div>

            </div>


            <!-- Stay -->

            <div class="card">

                <h3>
                    Stay Probability
                </h3>

                <div
                    class="percentage"
                    id="stayProbability">
                    0%
                </div>

                <div class="bar-container">

                    <div
                        class="bar"
                        id="stayBar">
                    </div>

                </div>

            </div>

        </div>


        <!-- Risk Level -->

        <div
            class="risk-box"
            id="riskBox">

            <div class="risk-title">
                Customer Risk Level
            </div>

            <div id="riskLevel">
                Loading...
            </div>

        </div>


        <!-- Recommendation -->

        <div class="recommendation">

            <h3>
                Recommended Action
            </h3>

            <p id="recommendationText">
                Loading recommendation...
            </p>

        </div>


        <!-- Button -->

        <div class="button-container">

            <button onclick="makeAnotherPrediction()">

                Make Another Prediction

            </button>

        </div>

    </div>

</div>


<script>

    // Get prediction result from sessionStorage

    const storedResult =
        sessionStorage.getItem("churnPrediction");


    if (!storedResult) {

        document.querySelector(".result-container").innerHTML = `
            <div class="error">
                <h2>No prediction result found.</h2>
                <p>Please go back and enter customer details.</p>
                <button onclick="goHome()">
                    Go to Prediction Page
                </button>
            </div>
        `;

    } else {

        try {

            const result =
                JSON.parse(storedResult);


            // -----------------------------
            // Prediction
            // -----------------------------

            document.getElementById(
                "predictionResult"
            ).textContent = result.result;


            // -----------------------------
            // Churn Probability
            // -----------------------------

            const churn =
                Number(result.churn_probability);

            document.getElementById(
                "churnProbability"
            ).textContent =
                churn.toFixed(2) + "%";

            document.getElementById(
                "churnBar"
            ).style.width =
                churn + "%";


            // -----------------------------
            // Stay Probability
            // -----------------------------

            const stay =
                Number(result.stay_probability);

            document.getElementById(
                "stayProbability"
            ).textContent =
                stay.toFixed(2) + "%";

            document.getElementById(
                "stayBar"
            ).style.width =
                stay + "%";


            // -----------------------------
            // Risk Level
            // -----------------------------

            const risk =
                result.risk_level;

            const riskElement =
                document.getElementById(
                    "riskLevel"
                );

            riskElement.textContent = risk;


            const riskBox =
                document.getElementById(
                    "riskBox"
                );


            if (risk === "High Risk") {

                riskBox.style.background =
                    "#ffe6e6";

                riskElement.style.color =
                    "#dc3545";

            }

            else if (risk === "Medium Risk") {

                riskBox.style.background =
                    "#fff3cd";

                riskElement.style.color =
                    "#d39e00";

            }

            else {

                riskBox.style.background =
                    "#e6f7ec";

                riskElement.style.color =
                    "#28a745";

            }


            // -----------------------------
            // Recommendation
            // -----------------------------

            document.getElementById(
                "recommendationText"
            ).textContent =
                result.recommendation;


        }

        catch (error) {

            document.querySelector(
                ".result-container"
            ).innerHTML = `

                <div class="error">

                    <h2>
                        Unable to display result
                    </h2>

                    <p>
                        ${error.message}
                    </p>

                    <button onclick="goHome()">
                        Go Back
                    </button>

                </div>

            `;

        }

    }


    // -----------------------------
    // Make Another Prediction
    // -----------------------------

    function makeAnotherPrediction() {

        sessionStorage.removeItem(
            "churnPrediction"
        );

        window.location.href = "/";

    }


    // -----------------------------
    // Go Home
    // -----------------------------

    function goHome() {

        window.location.href = "/";

    }

</script>

</body>

</html>
